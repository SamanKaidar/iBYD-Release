name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release Notes and Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat << 'NOTES' > release-notes.md
          ### iBYD v0.80

          Official public release for iBYD (Smart BYD Assistant & Vehicle Dashboard).

          #### What's New:
          - 🔄 **Enhanced Software Update Dialog**: Dedicated scrollable changelog container with smart markdown bullet formatting, version pill badge, dual-tone download progress bar, and modern automotive glassmorphism.
          - 🎙️ **Voice Agent Localization**: Streamlined voice settings to English and Arabic with seamless backward compatibility.
          - 📱 **Recent Apps Priority**: Dashboard app cockpit and Splitscreen app selector now automatically feature the 3 most recently selected applications at the top of the list with a "Recent" badge.
          NOTES
          APK_FILE=$(ls iBYD-*.apk | head -n 1)
          gh release create "$TAG" "$APK_FILE" --title "iBYD $TAG" --notes-file release-notes.md
