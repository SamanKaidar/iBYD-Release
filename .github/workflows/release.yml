name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release Notes and Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat << 'NOTES' > release-notes.md
          ### iBYD v0.25

          Official public release for iBYD (Smart BYD Assistant & Vehicle Dashboard).

          #### What's New:
          - 🌐 **RTL & Side Nav Language Adaptation**: Side navigation rail now dynamically adapts to language (Right side for Arabic, Persian, and Kurdish; Left side for English). Brand logo identity maintains correct orientation (`[logo] iBYD`).
          - ☀️ **Sunlight High-Contrast Mode**: Light theme tuned for direct car windshield sunlight with 15:1+ contrast text (`#0F172A`) and vivid automotive pigments; anti-glare dark theme for night driving.
          - ⚡ **Fluid Cockpit Animations**: Smooth cross-fade screen transitions, animated side rail selection pill, breathing neon charging glow on battery card, smooth horizontal battery level track, animated gear shifts (P/R/N/D), and tactile card touch feedback.
          NOTES
          gh release create "$TAG" iBYD-v0.25.apk --title "iBYD $TAG" --notes-file release-notes.md
