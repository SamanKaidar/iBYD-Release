name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release Notes and Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat << 'NOTES' > release-notes.md
          ### iBYD v0.91

          Official public release for iBYD (Smart BYD Assistant & Vehicle Dashboard).

          #### What's New:
          - 🎛️ **Steering Wheel & Volume Knob Remapping**: Full customization for steering wheel buttons (short press, long press, double click) and volume knob click (Custom App, Mute, Camera 360, Split Swap, Voice Assistant, Screen Off).
          - 🔔 **Custom Acoustic Lock & Unlock Chimes**: Audible feedback upon vehicle lock/unlock with built-in presets (Cyberpunk, Tesla style, Classic) and custom WAV/MP3 file selector.
          - ⚡ **Truthful ADB Activation & Auto-Confirmation (BYDMate v3.18.2 Sync)**:
            - Honest disclosure: without ADB, only trip history is available (live telemetry, car controls, cluster casting, split screen, and tweaks require ADB).
            - Clarified that Android developer settings do not work on BYD DiLink; direct link to GitHub guide.
            - Automatic confirmation of the 'Allow wireless debugging' dialog via AccessibilityService on reboot without manual taps.
          - 📺 **Instrument Cluster Navigation Casting**: Display configuration settings and instructions for casting navigation directly to BYD digital instrument cluster panels.
          - 🪟 **Split-Screen Workspace Enhancements**: Floating IME keyboard auto-coordination, Quick Search bridge, Pane swap toggle, Audio focus mute option, and UI font scale settings.
          NOTES
          APK_FILE=$(ls iBYD-*.apk | head -n 1)
          gh release create "$TAG" "$APK_FILE" --title "iBYD $TAG" --notes-file release-notes.md
