name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release Notes and Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat << 'NOTES' > release-notes.md
          ### iBYD v0.30

          Official public release for iBYD (Smart BYD Assistant & Vehicle Dashboard).

          #### What's New:
          - ☀️ **Light Mode Visibility Overhaul**: Replaced low-contrast and washed-out elements across Screens, Custom Dials, Settings, and Dashboard tabs with high-contrast automotive pigments and adaptive surfaces.
          - 🔌 **Dedicated ADB Status Pill**: Added an explicit ADB connection indicator right beside AEB Active on the dashboard top bar (`ADB CONNECTED` vs `LOCAL SERVICE`).
          - 🛡️ **Anti-Force-Stop & Crash Hardening**: Implemented coroutine exception handlers and safe foreground service startup guards against background execution limits.
          NOTES
          APK_FILE=$(ls iBYD-*.apk | head -n 1)
          gh release create "$TAG" "$APK_FILE" --title "iBYD $TAG" --notes-file release-notes.md
