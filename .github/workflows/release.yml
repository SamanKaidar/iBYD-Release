name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release Notes and Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat << 'NOTES' > release-notes.md
          ### iBYD v0.65

          Official public release for iBYD (Smart BYD Assistant & Vehicle Dashboard).

          #### What's New:
          - 🏎️ **Dual-Split Cockpit Dashboard**: Redesigned primary Dashboard into a dual-pane layout allowing simultaneous execution of any Android application (Maps, Spotify, Media) in an embedded virtual display split alongside real-time car telemetry, diagnostics, and battery status.
          - 🎨 **Adaptive Theme Reactivity**: Full dynamic theme synchronization across Cockpit TopBar, Desktop Floating Overlay, Live Radio Equalizer PiP, Automotive Launcher, and UI pills.
          - ⚡ **Performance & Core Architecture**: Streamlined vehicle telemetry pipeline, crash-hardening for foreground services, and updated build toolchain.
          NOTES
          APK_FILE=$(ls iBYD-*.apk | head -n 1)
          gh release create "$TAG" "$APK_FILE" --title "iBYD $TAG" --notes-file release-notes.md
